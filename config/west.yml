manifest:
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: englmaxi
      url-base: https://github.com/englmaxi
    - name: petercpark
      url-base: https://github.com/petercpark
  projects:
    # ZMK main (Zephyr 4.1) + cormoran's custom Studio protocol and DYA changes.
    # The v0.3 setup lives on the `main` branch of this repo (zmk: v0.3-branch+dya).
    - name: zmk
      remote: cormoran
      revision: main+dya
      import: app/west.yml
    # cormoran modules. On `main` these were pinned to their zmk-v0.3.0.0 tags; the
    # module `main` branches are tried here (compatibility with Zephyr 4.1 untested).
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
    - name: zmk-module-battery-history
      remote: cormoran
      revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: zmk-v0.4.0.0
    - name: zmk-dongle-display
      remote: englmaxi
      revision: main
    # Plover HID (steno). Upstream module, pinned to a commit known to build on ZMK main
    # (replaces the liwilz/zmk-hid-io-plover-hid v0.3-compat fork used on v0.3).
    - name: zmk-hid-io-plover-hid
      remote: petercpark
      revision: d895457418590dddf628c5ae907b39deec7095ff
    # Removed for the migration: hammerbeam-slideshow (nice_view_custom, LVGL 8; the
    # halves use the stock nice_view shield for now) and prospector-zmk-module.
  self:
    path: config
